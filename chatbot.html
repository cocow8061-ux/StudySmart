<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alex · 智能营销顾问</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    background: linear-gradient(135deg, #1e3a5f, #0f2744);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 14px;
    border-bottom: 1px solid #1e3a5f;
    flex-shrink: 0;
  }
  .avatar {
    width: 44px; height: 44px;
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: bold; color: #fff;
    box-shadow: 0 0 0 3px rgba(37,99,235,0.3);
  }
  .header-info h1 { font-size: 17px; font-weight: 600; color: #f0f6ff; }
  .header-info p  { font-size: 12px; color: #7c9cc0; margin-top: 1px; }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%; background: #22c55e;
    display: inline-block; margin-right: 5px;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,0.4)}
    50%{box-shadow:0 0 0 5px rgba(34,197,94,0)}
  }
  .model-badge {
    margin-left: auto;
    background: rgba(37,99,235,0.2);
    border: 1px solid rgba(37,99,235,0.4);
    color: #93c5fd;
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 20px;
  }
  .main {
    flex: 1;
    display: flex;
    overflow: hidden;
  }
  .chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }
  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }
  .msg {
    display: flex;
    gap: 10px;
    max-width: 82%;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  .msg.user { margin-left: auto; flex-direction: row-reverse; }
  .msg-avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; flex-shrink: 0; margin-top: 2px;
  }
  .msg.bot .msg-avatar  { background: linear-gradient(135deg,#1d4ed8,#1e40af); }
  .msg.user .msg-avatar { background: linear-gradient(135deg,#0f766e,#0d9488); }
  .msg-bubble {
    padding: 12px 15px;
    border-radius: 16px;
    font-size: 14.5px;
    line-height: 1.65;
    word-break: break-word;
  }
  .msg.bot .msg-bubble {
    background: #1e2d45;
    border: 1px solid #253655;
    border-top-left-radius: 4px;
    color: #dbeafe;
  }
  .msg.user .msg-bubble {
    background: linear-gradient(135deg,#1d4ed8,#2563eb);
    border-top-right-radius: 4px;
    color: #fff;
  }
  .typing-dots span {
    display: inline-block;
    width: 7px; height: 7px;
    background: #60a5fa;
    border-radius: 50%;
    margin: 0 2px;
    animation: bounce 1.2s infinite;
  }
  .typing-dots span:nth-child(2){animation-delay:.2s}
  .typing-dots span:nth-child(3){animation-delay:.4s}
  @keyframes bounce {
    0%,80%,100%{transform:translateY(0)}
    40%{transform:translateY(-8px)}
  }
  .sidebar {
    width: 200px;
    background: #0d1f35;
    border-left: 1px solid #1e3a5f;
    padding: 18px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex-shrink: 0;
    overflow-y: auto;
  }
  .sidebar h3 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: #4a6fa5;
    margin-bottom: 6px;
    padding-bottom: 6px;
    border-bottom: 1px solid #1a3050;
  }
  .stage-item {
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 12px;
    color: #4a6fa5;
    border: 1px solid transparent;
    transition: all 0.3s;
  }
  .stage-item.active {
    background: rgba(37,99,235,0.15);
    border-color: rgba(37,99,235,0.35);
    color: #93c5fd;
  }
  .stage-item.done { color: #22c55e; background: rgba(34,197,94,0.06); }
  .stage-num {
    display: inline-flex;
    width: 18px; height: 18px;
    background: rgba(37,99,235,0.2);
    border-radius: 50%;
    align-items: center; justify-content: center;
    font-size: 10px; font-weight: bold;
    margin-right: 6px;
    color: #60a5fa;
  }
  .stage-item.done .stage-num { background: rgba(34,197,94,0.2); color: #22c55e; }
  .input-bar {
    padding: 14px 20px 18px;
    background: #0d1a2d;
    border-top: 1px solid #1e3a5f;
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  #userInput {
    flex: 1;
    background: #1e2d45;
    border: 1px solid #253655;
    border-radius: 12px;
    color: #e2e8f0;
    font-size: 14px;
    padding: 11px 15px;
    resize: none;
    max-height: 110px;
    min-height: 44px;
    outline: none;
    transition: border-color 0.2s;
    font-family: inherit;
    line-height: 1.5;
  }
  #userInput:focus { border-color: #2563eb; }
  #userInput::placeholder { color: #3d5a80; }
  .btn {
    width: 44px; height: 44px;
    border: none; cursor: pointer;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  #sendBtn {
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    color: #fff;
  }
  #sendBtn:hover:not(:disabled) { background: linear-gradient(135deg,#1d4ed8,#1e40af); transform:scale(1.05); }
  #sendBtn:disabled { opacity: 0.4; cursor: not-allowed; }
  #voiceBtn {
    background: #1e2d45;
    border: 1px solid #253655;
    color: #60a5fa;
  }
  #voiceBtn:hover { background: #253655; }
  #voiceBtn.recording { background: #7f1d1d; border-color: #ef4444; color: #ef4444; animation: ring 1s infinite; }
  @keyframes ring {
    0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0.4)}
    50%{box-shadow:0 0 0 6px rgba(239,68,68,0)}
  }
  #newChatBtn {
    background: #1e2d45;
    border: 1px solid #253655;
    color: #7c9cc0;
    font-size: 14px;
  }
  #newChatBtn:hover { background: #253655; color: #e2e8f0; }
  #toast {
    position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
    background: #1e3a5f; color: #93c5fd; padding: 8px 18px;
    border-radius: 20px; font-size: 13px;
    border: 1px solid #2563eb; opacity: 0;
    transition: opacity 0.3s; pointer-events: none; z-index: 999;
  }
  #toast.show { opacity: 1; }
  @media(max-width:640px){
    .sidebar { display: none; }
    .model-badge { display: none; }
    #messages { padding: 14px; }
    .msg { max-width: 92%; }
  }
</style>
</head>
<body>

<header>
  <div class="avatar">A</div>
  <div class="header-info">
    <h1><span class="status-dot"></span>Alex · 智能营销顾问</h1>
    <p>大模型解决方案专家 · 15年B2B销售经验</p>
  </div>
  <div class="model-badge">🤖 claude-opus-4-6</div>
</header>

<div class="main">
  <div class="chat-area">
    <div id="messages"></div>
    <div class="input-bar">
      <button class="btn" id="newChatBtn" title="新对话">↺</button>
      <textarea id="userInput" placeholder="输入您的问题... (Enter发送，Shift+Enter换行)" rows="1"></textarea>
      <button class="btn" id="voiceBtn" title="语音输入">🎤</button>
      <button class="btn" id="sendBtn" title="发送">➤</button>
    </div>
  </div>

  <div class="sidebar">
    <h3>对话进程</h3>
    <div class="stage-item active" id="s1"><span class="stage-num">1</span>建立信任</div>
    <div class="stage-item" id="s2"><span class="stage-num">2</span>需求探索</div>
    <div class="stage-item" id="s3"><span class="stage-num">3</span>痛点放大</div>
    <div class="stage-item" id="s4"><span class="stage-num">4</span>价值展示</div>
    <div class="stage-item" id="s5"><span class="stage-num">5</span>信任建立</div>
    <div class="stage-item" id="s6"><span class="stage-num">6</span>异议处理</div>
    <div class="stage-item" id="s7"><span class="stage-num">7</span>促成决策</div>
  </div>
</div>

<div id="toast"></div>

<script>
const state = {
  messages: [],
  stage: 1,
  streaming: false,
  turns: 0,
  voiceActive: false,
};

const synth = window.speechSynthesis;
let recognition = null;

const msgEl    = document.getElementById('messages');
const inputEl  = document.getElementById('userInput');
const sendBtn  = document.getElementById('sendBtn');
const voiceBtn = document.getElementById('voiceBtn');
const newChatBtn = document.getElementById('newChatBtn');

// ── VOICE SYNTHESIS ──────────────────────────────────────────
function pickMaleVoice() {
  const voices = synth.getVoices();
  const tests = [
    v => v.lang.startsWith('zh') && /kangkang|yunhao|yunxi|yunjian|male/i.test(v.name),
    v => v.lang.startsWith('zh'),
    v => /^(david|daniel|james|thomas|william|george|mark)\b/i.test(v.name),
    v => /male/i.test(v.name),
    v => true,
  ];
  for (const t of tests) {
    const v = voices.find(t);
    if (v) return v;
  }
  return null;
}
if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = () => {};

function speak(text) {
  if (!synth || !text.trim()) return;
  synth.cancel();
  const clean = text.replace(/[*_`#>~\[\]()！]/g, '').replace(/\n+/g, '。').trim();
  if (!clean) return;
  const u = new SpeechSynthesisUtterance(clean);
  const v = pickMaleVoice();
  if (v) u.voice = v;
  u.lang = 'zh-CN';
  u.rate = 0.9;
  u.pitch = 0.8;
  u.volume = 1;
  synth.speak(u);
}

// ── SPEECH RECOGNITION ───────────────────────────────────────
function setupRec() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return;
  recognition = new SR();
  recognition.lang = 'zh-CN';
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.onresult = e => {
    let interim = '', final = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      (e.results[i].isFinal ? x => final += x : x => interim += x)(e.results[i][0].transcript);
    }
    inputEl.value = final || interim;
    autoResize();
  };
  recognition.onend = () => {
    state.voiceActive = false;
    voiceBtn.classList.remove('recording');
    voiceBtn.textContent = '🎤';
    if (inputEl.value.trim()) sendMessage();
  };
  recognition.onerror = () => {
    state.voiceActive = false;
    voiceBtn.classList.remove('recording');
    voiceBtn.textContent = '🎤';
  };
}
setupRec();

voiceBtn.onclick = () => {
  if (!recognition) { toast('请使用 Chrome 浏览器以支持语音输入'); return; }
  if (state.voiceActive) {
    recognition.stop();
  } else {
    synth.cancel();
    state.voiceActive = true;
    voiceBtn.classList.add('recording');
    voiceBtn.textContent = '⏹';
    recognition.start();
    toast('正在聆听...');
  }
};

// ── RENDER ───────────────────────────────────────────────────
function addMsg(role, text) {
  const wrap = document.createElement('div');
  wrap.className = `msg ${role}`;
  const av = document.createElement('div');
  av.className = 'msg-avatar';
  av.textContent = role === 'bot' ? 'A' : '你';
  const bub = document.createElement('div');
  bub.className = 'msg-bubble';
  if (text) bub.textContent = text;
  wrap.appendChild(av);
  wrap.appendChild(bub);
  msgEl.appendChild(wrap);
  scrollBottom();
  return bub;
}

function addTyping() {
  const wrap = document.createElement('div');
  wrap.className = 'msg bot';
  wrap.id = 'typing';
  wrap.innerHTML = `<div class="msg-avatar">A</div><div class="msg-bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div>`;
  msgEl.appendChild(wrap);
  scrollBottom();
}

function removeTyping() {
  const el = document.getElementById('typing');
  if (el) el.remove();
}

function scrollBottom() { msgEl.scrollTop = msgEl.scrollHeight; }

// ── SEND ─────────────────────────────────────────────────────
async function sendMessage(forcedText) {
  const content = (forcedText || inputEl.value).trim();
  if (!content || state.streaming) return;
  inputEl.value = '';
  autoResize();
  sendBtn.disabled = true;
  state.streaming = true;
  state.turns++;

  addMsg('user', content);
  state.messages.push({ role: 'user', content });
  addTyping();

  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: state.messages }),
    });

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      removeTyping();
      addMsg('bot', '⚠️ ' + (err.error || '请求失败 (' + resp.status + ')'));
      state.messages.pop();
      return;
    }

    removeTyping();
    const bubble = addMsg('bot', '');
    let full = '';
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6);
        if (data === '[DONE]') continue;
        try {
          const obj = JSON.parse(data);
          if (obj.error) { bubble.textContent = '⚠️ ' + obj.error; return; }
          if (obj.text)  { full += obj.text; bubble.textContent = full; scrollBottom(); }
        } catch (_) {}
      }
    }

    if (full) {
      state.messages.push({ role: 'assistant', content: full });
      advStage();
      speak(full);
    }
  } catch (err) {
    removeTyping();
    addMsg('bot', '⚠️ 网络错误，请确认 server.js 正在运行');
    state.messages.pop();
    console.error(err);
  } finally {
    state.streaming = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

// ── STAGE ────────────────────────────────────────────────────
function advStage() {
  const thresholds = [0, 3, 5, 8, 11, 13, 16, 999];
  let next = state.stage;
  if (state.stage < 7 && state.turns >= thresholds[state.stage]) next = state.stage + 1;
  if (next !== state.stage) {
    document.getElementById(`s${state.stage}`)?.classList.replace('active','done');
    state.stage = next;
    document.getElementById(`s${state.stage}`)?.classList.add('active');
  }
}

function resetStages() {
  for (let i = 1; i <= 7; i++) {
    const el = document.getElementById(`s${i}`);
    el.className = 'stage-item' + (i === 1 ? ' active' : '');
  }
}

// ── NEW CHAT ─────────────────────────────────────────────────
newChatBtn.onclick = () => {
  state.messages = []; state.stage = 1; state.turns = 0;
  synth.cancel(); msgEl.innerHTML = '';
  resetStages();
  setTimeout(greeting, 500);
};

// ── TEXTAREA ─────────────────────────────────────────────────
function autoResize() {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 110) + 'px';
}
inputEl.addEventListener('input', autoResize);
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
sendBtn.onclick = () => sendMessage();

// ── TOAST ────────────────────────────────────────────────────
function toast(msg, dur = 2000) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), dur);
}

// ── GREETING ─────────────────────────────────────────────────
async function greeting() {
  const opts = [
    '您好！我是Alex，专注于AI大模型解决方案的资深顾问。很高兴认识您！请问您目前在哪个行业，或者对哪方面的智能化解决方案感兴趣？',
    '您好！我是Alex，大模型与AI落地应用专家，从事B2B销售15年。请问您今天找我，是对AI技术有所了解，还是正在寻找某类智能化解决方案呢？',
    '您好，我是Alex！专门帮助企业和政府机构找到适合的大模型解决方案。请问贵单位目前在哪些方面有数字化或智能化的需求？',
  ];
  const text = opts[Math.floor(Math.random() * opts.length)];
  const bubble = addMsg('bot', '');
  for (let i = 0; i <= text.length; i++) {
    bubble.textContent = text.slice(0, i);
    scrollBottom();
    await new Promise(r => setTimeout(r, 25));
  }
  state.messages.push({ role: 'assistant', content: text });
  setTimeout(() => speak(text), 300);
}

// ── INIT ─────────────────────────────────────────────────────
(async () => {
  try {
    const r = await fetch('/api/status');
    const d = await r.json();
    if (!d.ready) {
      addMsg('bot', '⚠️ 服务未就绪，请重启 server.js');
      return;
    }
  } catch (_) {
    addMsg('bot', '⚠️ 无法连接服务器，请先运行：bash start.sh');
    return;
  }
  setTimeout(greeting, 600);
})();
</script>
</body>
</html>
